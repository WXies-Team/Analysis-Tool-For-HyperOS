name: Analysis Tool For HyperOS

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备类型"
        required: true
        type: choice
        options:
        - "Phone"
        - "Pad"
        - "Fold"
        - "Flip"
      link:
        description: "ROM 链接"
        required: true
      push:
        description: "上传数据库"
        required: true
        type: choice
        options:
        - "是"
        - "否"
      devicename:
        description: "设备名"
        required: false
      osversion:
        description: "系统版本"
        required: false

jobs:
  Analysis:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      # 自托管工作区跨任务保留，checkout 默认 git clean -ffdx 清理上次残留

    - name: Checkout latest stable release
      run: |
        TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
        if [ -z "$TAG" ]; then
          echo "No stable release tag found"
          exit 1
        fi
        echo "Using release: $TAG"
        git checkout "$TAG"

    - name: Install system dependencies
      run: |
        SUDO=""; [ "$(id -u)" = "0" ] || SUDO="sudo"
        if ! command -v aria2c >/dev/null 2>&1; then
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq aria2
        fi
        if ! command -v 7z >/dev/null 2>&1; then
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq p7zip-full
        fi

    - name: Download dependencies-Linux-x86_64
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "ssut/payload-dumper-go"
        latest: true
        extract: true
        fileName: "payload-dumper-go_*_linux_amd64.tar.gz"
    - uses: robinraju/release-downloader@v1.13
      with:
        repository: "sekaiacg/erofs-utils"
        latest: true
        extract: true
        fileName: "erofs-utils-*Linux_x86_64*.zip"

    - name: Resolve device
      env:
        DEVICE: ${{ github.event.inputs.device }}
      run: |
        case "$DEVICE" in
          Phone) arg=ph;  dir=phone;;
          Pad)   arg=p;   dir=pad;;
          Fold)  arg=f;   dir=fold;;
          Flip)  arg=fp;  dir=flip;;
          *) echo "Invalid device specified."; exit 1;;
        esac
        echo "DEVICE_ARG=$arg" >> "$GITHUB_ENV"
        echo "DEVICE_DIR=$dir" >> "$GITHUB_ENV"

    - name: Install dependence
      run: |
        VENV="$HOME/.cache/ath-venv"
        if [ ! -x "$VENV/bin/python" ]; then
          python3 -m venv "$VENV"
        fi
        "$VENV/bin/pip" install -q -r requirements.txt
        echo "$VENV/bin" >> "$GITHUB_PATH"
        mkdir -p tools
        mv extract.erofs payload-dumper-go tools/
        chmod +x tools/extract.erofs tools/payload-dumper-go

    - name: Download ROM
      env:
        LINK: ${{ github.event.inputs.link }}
      run: |
        python main.py -d "$LINK"

    - name: Switch device type
      run: python main.py -t 0 "$DEVICE_ARG"

    - name: Unzip payload.bin
      run: |
        python main.py -p
        rm *.zip

    - name: Unzip img
      run: |
        python main.py -i
        rm payload.bin

    - name: Unzip file
      run: python main.py -f

    - name: Remove exclude apk
      run: python main.py -a

    - name: Upload special apk
      uses: actions/upload-artifact@v7
      with:
        name: Special_apk
        path: |
          output_apk/MIUIScreenRecorder.apk
          output_apk/MIUIScreenRecorderLite.apk
          output_apk/MIUISecurityCenter.apk
          output_apk/MiuiHome.apk
          output_apk/AiAsstVision.apk

    - name: Update database & rename
      run: python main.py -n -u -m

    - name: Upload database
      uses: actions/upload-artifact@v7
      with:
        name: Database
        path: |
          app_version.json
          app_code.json

    - name: Upload build.prop
      uses: actions/upload-artifact@v7
      with:
        name: build.prop
        path: |
          product/etc/build.prop

    - name: Upload update apk
      uses: actions/upload-artifact@v7
      with:
        name: Update_apk
        path: |
          update_apk
          update_name_apk

    - name: Push database
      continue-on-error: true
      env:
        DEVICENAME: ${{ github.event.inputs.devicename }}
        OSVERSION: ${{ github.event.inputs.osversion }}
        PUSHDB: ${{ github.event.inputs.push }}
      run: |
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config user.name "${GITHUB_ACTOR}"
        python main.py -t 1 "$DEVICE_ARG"
        git add "$DEVICE_DIR/"
        if [ "$PUSHDB" = "是" ]; then
          git commit -m "chore: update $DEVICENAME $OSVERSION by action [skip ci]" || exit 0
          git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 0; }
          git push origin HEAD:main || exit 0
        fi

    - name: Get Info
      continue-on-error: true
      run: python main.py -o
